name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Output Directory
        run: mkdir -p dist

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v2.0.0
        with:
          user: Umar-Adnan
          theme: 2077
          background: 0d1117
          border: e63946
          stroke: e63946
          ring: e63946
          fire: e63946
          currStreakLabel: e63946
          currStreakNum: e63946
          sideNums: e63946
          sideLabels: ffffff
          dates: ffffff
          output_filename: dist/github-streak-stat.svg

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
