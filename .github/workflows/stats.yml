name: Generate Profile Stats

on:
  schedule:
    - cron: "0 * * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: github-readme-stats/github-readme-stats-action@v2
        with:
          card: stats
          options: "show_icons=true&theme=tokyonight"
          path: profile/stats.svg

      - name: Generate Top Languages Card
        uses: github-readme-stats/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "layout=compact&theme=tokyonight&hide=html,css"
          path: profile/top-langs.svg

      - name: Commit and Push Generated Cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile stats cards" || exit 0
          git push
