name: Generate Snake Animation

on:
  schedule:
    - cron: "*/12 * * * *" # Runs every hour
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Custom Red & Black Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e63946&color_dots=%23161b22,%233d0000,%23800000,%23b30000,%23e63946

      - name: Push SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
